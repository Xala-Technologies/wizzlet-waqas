# Release / deploy coordinator — NOT ENABLED.
#
# This workflow is intentionally non-publishing until:
# - GitHub Environment "production" protections exist
# - Vercel/Convex secrets are scoped to that environment
# - A single deploy coordinator is chosen (Vercel git production branch OR this workflow — not both)
# - Separate human authorization enables the jobs below
#
# Do not remove the `if: false` gates without completing docs/release-process.md activation checklist.
name: Release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact release candidate SHA (must match checkout)
        required: true
        type: string
      confirm:
        description: Type ENABLE-RELEASE to acknowledge this is still blocked by default
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  gate:
    name: Preconditions (disabled)
    runs-on: ubuntu-latest
    # Hard off until remote activation is authorized.
    if: false
    steps:
      - name: Refuse until enabled
        run: |
          set -euo pipefail
          echo "Release workflow is not enabled. See docs/release-process.md"
          exit 1

  # Placeholder for a future authorized job. Remains disabled.
  deploy_frontend:
    name: Deploy frontend (disabled)
    needs: gate
    runs-on: ubuntu-latest
    if: false
    environment: production
    steps:
      - name: Not configured
        run: |
          set -euo pipefail
          echo "BLOCKED: no deploy secrets or coordinator configured"
          exit 1

  deploy_convex:
    name: Deploy Convex (disabled)
    needs: gate
    runs-on: ubuntu-latest
    if: false
    environment: production
    steps:
      - name: Not configured
        run: |
          set -euo pipefail
          echo "BLOCKED: CONVEX_DEPLOY_KEY not wired; do not use developer keys here"
          exit 1
