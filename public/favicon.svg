<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sweeph">
  <defs>
    <linearGradient id="s" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#72F0D1"/>
      <stop offset="48%" stop-color="#12CDB0"/>
      <stop offset="100%" stop-color="#087F82"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#08172D"/>
  <!-- Abstract S mark: two parallel rounded capsules -->
